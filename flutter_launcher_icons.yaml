# Icônes natives + web Baillan (FEAT-024).
# Masters générés par `flutter test tool/generate_brand_assets.dart`
# (B EB Garamond italique + paraphe, palette AppTheme — écho du favicon).
# Régénérer les icônes : dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/icon_full_1024.png"

  android: true
  # Adaptive : fond encre uni + calque monogramme (safe zone respectée).
  adaptive_icon_background: "#1B1A17"
  adaptive_icon_foreground: "assets/brand/icon_foreground_1024.png"
  # Themed icons Android 13+ (le launcher teinte le masque alpha).
  adaptive_icon_monochrome: "assets/brand/icon_monochrome_1024.png"

  ios: true
  # App Store exige des icônes iOS sans canal alpha.
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/brand/icon_full_1024.png"
    background_color: "#F7F4ED"
    theme_color: "#1B1A17"
