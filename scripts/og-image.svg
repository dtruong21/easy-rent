<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Baillan — carte sociale Open Graph 1200x630. Source éditable.
       Rendu en PNG par scripts/generate-og-image.sh (rsvg-convert).
       Charte : encre #1B1A17, papier #F7F4ED, accent #B5B89D.
       Police : Cochin italique (macOS) = le paraphe de marque, avec repli
       Palatino > Georgia > serif si Cochin absent. -->

  <!-- Fond encre -->
  <rect width="1200" height="630" fill="#1B1A17"/>

  <!-- Cadre « registre » : filet papier discret -->
  <rect x="44" y="44" width="1112" height="542" rx="14"
        fill="none" stroke="#B5B89D" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Emblème : « B » paraphe (cf. favicon inline dans web/index.html) -->
  <text x="270" y="392" text-anchor="middle"
        font-family="Cochin, 'Palatino Linotype', Palatino, Georgia, serif"
        font-style="italic" font-size="300" fill="#F7F4ED">B</text>
  <path d="M 178 430 Q 270 462 362 430"
        fill="none" stroke="#B5B89D" stroke-width="8" stroke-linecap="round"/>

  <!-- Filet vertical de séparation -->
  <line x1="500" y1="182" x2="500" y2="448"
        stroke="#B5B89D" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Lockup texte -->
  <text x="560" y="272"
        font-family="Cochin, 'Palatino Linotype', Palatino, Georgia, serif"
        font-size="126" fill="#F7F4ED">Baillan.</text>

  <!-- Tiret d'accent sous le wordmark -->
  <line x1="563" y1="302" x2="693" y2="302"
        stroke="#B5B89D" stroke-width="5" stroke-linecap="round"/>

  <text x="560" y="386"
        font-family="Cochin, 'Palatino Linotype', Palatino, Georgia, serif"
        font-style="italic" font-size="58" fill="#B5B89D">Tenir registre.</text>

  <text x="562" y="452"
        font-family="Cochin, 'Palatino Linotype', Palatino, Georgia, serif"
        font-size="38" fill="#F7F4ED" fill-opacity="0.66">Gestion locative pour bailleurs</text>
</svg>
