# CI mobile (FEAT-024) — vérifie que la plateforme Android buildte toujours.
#
# Périmètre volontairement réduit :
# - Déclenché seulement quand la config plateforme ou les dépendances
#   changent (android/, ios/, pubspec) — les erreurs Dart pures sont déjà
#   attrapées par `flutter analyze` dans ci.yml, inutile de rebuilder un APK
#   à chaque commit de code.
# - APK **debug** : pas de key.properties en CI → le build.gradle.kts
#   retombe sur la signature debug (fallback prévu). La clé d'upload reste
#   locale (cf. docs/MOBILE.md).
# - Pas de job iOS : runner macOS = 10× le coût à la minute, et la casse
#   plateforme iOS se détecte au build local / à l'archive (décision
#   docs/MOBILE.md — à revoir si l'équipe grossit).
# - Non bloquant pour le merge tant que le check n'est pas ajouté aux
#   « required status checks » de la branch protection.
#
# `workflow_dispatch` permet aussi de produire un APK debug à la demande
# (artefact téléchargeable 7 jours — pratique pour tester sur device).

name: Mobile

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "android/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main, develop]
    paths:
      - "android/**"
      - "ios/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-apk:
    name: Build APK debug Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 8.x requiert JDK 17+ — épinglé pour rester déterministe quand
      # l'image du runner change de JDK par défaut.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Même pin que ci.yml (voir docs/MOBILE.md + mémoire CI) : ne pas
      # dépinner l'un sans l'autre.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/settings.gradle.kts', 'android/app/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install deps
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        timeout-minutes: 15
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: baillan-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
