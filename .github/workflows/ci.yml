name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs only for pull requests (a new commit to a PR makes
  # the previous run obsolete). For push to develop/main, let EVERY commit's
  # CI run to completion: with cancel-in-progress on push, rapid back-to-back
  # merges cancel each other and the branch HEAD never lands a completed
  # (green) CI run. On push, runs serialize on the shared group instead.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Install deps
        run: flutter pub get

      # Même borne que dans `deploy.yml` (incident du 2026-08-13 : blocage de
      # six heures sur cette étape côté déploiement). Ici l'étape n'a jamais
      # posé problème — on la borne quand même, parce qu'un blocage identique
      # sur ce workflow retiendrait la CI de toutes les PR sans rien signaler.
      - name: Generate code (freezed / json_serializable)
        timeout-minutes: 15
        run: dart run build_runner build --delete-conflicting-outputs

      # FEAT-056 — la grille de droits (quotas/features par palier) a une
      # SOURCE CANONIQUE UNIQUE, config/entitlements.json, d'où sont générés le
      # miroir Dart et le miroir TypeScript. Sans cette garde, client et
      # serveur peuvent diverger silencieusement sur un plafond (risque R1 du
      # plan : l'UI autorise ce que la Cloud Function refuse). Le script
      # relance les DEUX générateurs (dart + node, tous deux présents sur ce
      # runner) et échoue si un miroir est périmé, édité à la main, ou si les
      # deux sourceSha divergent.
      - name: Check entitlements parity (FEAT-056)
        run: bash scripts/check-entitlements-parity.sh

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Tests
        run: flutter test --reporter=expanded

      - name: Detect secrets in repo
        run: bash scripts/check-secrets.sh --all

      - name: Check Firestore isolation (ADR 0003)
        run: bash scripts/check-db-isolation.sh

  functions:
    name: Functions (lint · build · test)
    runs-on: ubuntu-latest
    # Job Node séparé (les Cloud Functions sont un projet npm indépendant sous
    # functions/). Jusqu'ici la suite vitest (createLease/createPayment, webhook
    # RevenueCat, etc.) n'était validée qu'en local — ce job la met sous CI.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: functions

      - name: Lint
        run: npm run lint
        working-directory: functions

      - name: Typecheck (build déployable)
        run: npm run build
        working-directory: functions

      - name: Tests
        run: npm test
        working-directory: functions

  firestore-rules:
    name: Firestore Rules (cross-user)
    runs-on: ubuntu-latest
    # Les Firestore Security Rules sont sécurité-critiques (deny-by-default,
    # scoping cross-user par landlordId, gel de subscriptionTier/compteurs/pro*)
    # et se déploient TELLES QUELLES en prod (règles partagées prod/staging, cf.
    # docs/ENVIRONMENTS.md). La suite rules-unit-testing (firestore_rules.test.ts)
    # n'était jusqu'ici validée qu'en local — ce job la met sous CI (mise en
    # lumière par FEAT-044f / PR #142 : gel des champs pro* + 3 tests cross-user
    # non couverts). Répond au Definition of Done : « Règles Firestore testées
    # (cross-user) ».
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # `test:rules` épingle `firebase-tools@13` : les CLI >= 14 exigent un
      # JDK >= 21. On reste sur temurin 17, iso avec la machine de dev (cf.
      # l'entête de functions/rules-tests/firestore_rules.test.ts).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Évite de re-télécharger le jar de l'émulateur Firestore (~63 Mo) à chaque
      # run. Clé statique versionnée : firebase-tools est épinglé, donc la
      # version du jar est stable ; bumper le suffixe pour invalider au besoin.
      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v1

      - name: Install deps
        run: npm ci
        working-directory: functions

      # Wrappe `firebase-tools@13 emulators:exec --only firestore` (projet
      # demo-* : aucun credential requis) puis lance vitest sur rules-tests/.
      - name: Test Firestore rules
        run: npm run test:rules
        working-directory: functions
