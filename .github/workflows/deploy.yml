name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: 'Force target (dev or prod)'
        required: false
        type: choice
        options:
          - auto
          - dev
          - prod
        default: auto

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  determine-env:
    name: Determine target environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      schema: ${{ steps.set.outputs.schema }}
      firebase_channel: ${{ steps.set.outputs.firebase_channel }}
    steps:
      - id: set
        run: |
          # Décide l'env à partir de la branche, sauf override manuel
          OVERRIDE="${{ github.event.inputs.target }}"
          BRANCH="${{ github.ref_name }}"

          if [ "$OVERRIDE" = "prod" ] || ([ "$OVERRIDE" = "auto" ] && [ "$BRANCH" = "main" ]); then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "schema=public" >> $GITHUB_OUTPUT
            echo "firebase_channel=live" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "schema=dev" >> $GITHUB_OUTPUT
            echo "firebase_channel=staging" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    name: Build & Deploy (${{ needs.determine-env.outputs.env_name }})
    needs: determine-env
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Build web (release)
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SUPABASE_SCHEMA=${{ needs.determine-env.outputs.schema }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: ${{ needs.determine-env.outputs.firebase_channel }}

  apply-supabase-migrations:
    name: Apply Supabase migrations
    needs: determine-env
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.env_name }}
    # Les migrations sont identiques quel que soit l'env (touchent les 2 schémas via SQL)
    # On les applique uniquement depuis main pour éviter les doubles applications
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply migrations (both public + dev schemas)
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
