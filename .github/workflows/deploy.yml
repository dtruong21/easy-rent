name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: 'Force target (dev or prod)'
        required: false
        type: choice
        options:
          - auto
          - dev
          - prod
        default: auto

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  determine-env:
    name: Determine target environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      schema: ${{ steps.set.outputs.schema }}
      firebase_channel: ${{ steps.set.outputs.firebase_channel }}
    steps:
      - id: set
        run: |
          # Décide l'env à partir de la branche, sauf override manuel
          OVERRIDE="${{ github.event.inputs.target }}"
          BRANCH="${{ github.ref_name }}"

          if [ "$OVERRIDE" = "prod" ] || ([ "$OVERRIDE" = "auto" ] && [ "$BRANCH" = "main" ]); then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "schema=public" >> $GITHUB_OUTPUT
            echo "firebase_channel=live" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "schema=dev" >> $GITHUB_OUTPUT
            echo "firebase_channel=staging" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    name: Build & Deploy (${{ needs.determine-env.outputs.env_name }})
    needs: determine-env
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web (release)
        # En staging on désactive le service worker pour éviter le piège de cache PWA
        # quand un nouveau build est déployé (l'ancien SW continue sinon de servir l'ancien
        # bundle pendant des heures, même après hard reload). En production on garde le SW
        # par défaut (offline-first) — comportement PWA attendu pour les utilisateurs réels.
        run: |
          flutter build web --release \
            ${{ needs.determine-env.outputs.env_name == 'staging' && '--pwa-strategy=none' || '' }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=SUPABASE_SCHEMA=${{ needs.determine-env.outputs.schema }}

      # CI deploy via firebase-tools CLI direct (au lieu de
      # FirebaseExtended/action-hosting-deploy@v0) car cette action a un bug
      # de retry race documenté : lors d'un "premature close" réseau sur le
      # POST /channels/:id/releases, le retry interne resoumet la même version
      # qui a déjà été commit côté serveur → 400 FAILED_PRECONDITION. Le code
      # est en réalité déployé mais le step CI ressort en failure (faux négatif
      # observé 3× consécutivement). Diagnostic complet : workflow wf_eb506d7f-620.
      # Solution : CLI direct sans retry interne — un seul POST, soit ça
      # passe, soit on relance le job.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@13

      - name: Write Firebase service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Deploy to Firebase Hosting (CLI direct)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CHANNEL: ${{ needs.determine-env.outputs.firebase_channel }}
        run: |
          if [ "$FIREBASE_CHANNEL" = "live" ]; then
            firebase deploy --only hosting \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive
          else
            firebase hosting:channel:deploy "$FIREBASE_CHANNEL" \
              --project "$FIREBASE_PROJECT_ID" \
              --expires 7d \
              --non-interactive
          fi

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

  # FEAT-010 (D5) : Les migrations prod sont désactivées ici.
  # Utiliser le workflow dédié `.github/workflows/migrate-prod.yml`
  # (workflow_dispatch avec confirmation manuelle "yes").
  # Raison : éviter une migration silencieuse sur chaque push main.
  # apply-supabase-migrations: (désactivé intentionnellement)
