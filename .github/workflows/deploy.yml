name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: 'Force target (dev or prod)'
        required: false
        type: choice
        options:
          - auto
          - dev
          - prod
        default: auto

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  determine-env:
    name: Determine target environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      app_env: ${{ steps.set.outputs.app_env }}
      firebase_channel: ${{ steps.set.outputs.firebase_channel }}
    steps:
      - id: set
        run: |
          OVERRIDE="${{ github.event.inputs.target }}"
          BRANCH="${{ github.ref_name }}"
          # Sur un `push` (pas un workflow_dispatch), inputs.target est VIDE —
          # on le traite comme "auto" pour que la détection par branche joue.
          # Sans ça, un push sur `main` retombait dans le `else` → déploiement
          # STAGING au lieu de PROD (bug corrigé 2026-07-05 : release #65
          # déployée à la main faute de ce fix).
          [ -z "$OVERRIDE" ] && OVERRIDE="auto"

          if [ "$OVERRIDE" = "prod" ] || ([ "$OVERRIDE" = "auto" ] && [ "$BRANCH" = "main" ]); then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "app_env=prod" >> $GITHUB_OUTPUT
            echo "firebase_channel=live" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "app_env=dev" >> $GITHUB_OUTPUT
            echo "firebase_channel=staging" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    name: Build & Deploy (${{ needs.determine-env.outputs.env_name }})
    needs: determine-env
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.env_name }}
    permissions:
      contents: write # push du tag vX.Y.Z + GitHub Release (uniquement en prod)
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 → historique complet + tags. Indispensable pour la
          # dérivation de version (git describe + rev-list --count) des steps
          # « Determine version » et « Tag release ». Le checkout shallow par
          # défaut casserait les deux.
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      # Dérive la version depuis git (tags + nb de commits) — voir
      # tool/release/version.sh. En PROD on calcule la PROCHAINE version (bump
      # déduit des commits conventionnels) ; en STAGING on reflète la dernière
      # version publiée + le nb de commits de develop (build number plus haut →
      # identifie le build staging). Rien n'est stocké dans un fichier édité par
      # branche → aucun conflit de version.
      - name: Determine version
        id: ver
        run: |
          if [ "${{ needs.determine-env.outputs.app_env }}" = "prod" ]; then
            NAME="$(bash tool/release/version.sh next auto)"
            CODENAME="$(bash tool/release/version.sh codename-next auto)"
          else
            NAME="$(bash tool/release/version.sh name)"
            CODENAME="$(bash tool/release/version.sh codename)"
          fi
          CODE="$(bash tool/release/version.sh code)"
          echo "name=$NAME"         >> "$GITHUB_OUTPUT"
          echo "code=$CODE"         >> "$GITHUB_OUTPUT"
          echo "codename=$CODENAME" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::$NAME+$CODE « $CODENAME » (${{ needs.determine-env.outputs.app_env }})"

      - name: Build web (release)
        # En staging on désactive le service worker pour éviter le piège de cache PWA
        # quand un nouveau build est déployé (l'ancien SW continue sinon de servir l'ancien
        # bundle pendant des heures, même après hard reload). En production on garde le SW
        # par défaut (offline-first) — comportement PWA attendu pour les utilisateurs réels.
        #
        # Firebase config (apiKey, projectId, etc.) est embarquée dans
        # lib/firebase_options.dart — pas besoin de dart-defines (les Firebase
        # Web keys sont publiques par design, sécurité via Rules + App Check).
        # --build-name / --build-number : version dérivée de git (step
        # « Determine version ») → version.json (web) et versionCode/versionName
        # (mobile) → Profil → À propos. Le build number = nb de commits, donc
        # strictement croissant (contrainte stores satisfaite).
        # --pwa-strategy=none sur les DEUX environnements : index.html porte un
        # script qui désenregistre tout Service Worker (héritage FEAT-019, fix
        # cache-poisoning). Tant que ce script est présent, prod DOIT aussi être
        # SW-less — sinon le SW prod est tué à chaque session (churn + reload).
        # Réactiver l'offline-first = retirer d'abord ce script d'index.html.
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --dart-define=APP_ENV=${{ needs.determine-env.outputs.app_env }} \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }}

      # SEO (FEAT-049) — noindex sur STAGING uniquement. firebase.json est
      # partagé entre le channel live (prod) et les channels de preview, donc un
      # header X-Robots-Tag par-canal est impossible : on patche l'artefact
      # build/web juste avant le deploy sur les builds dev. robots.txt devient
      # tout-bloquant, le sitemap est retiré, et la <meta robots> passe en
      # noindex. La PROD (main → app_env=prod) saute cette étape et conserve
      # "index, follow" + le sitemap — asymétrie de risque volontaire (sûr même
      # si l'étape est un jour oubliée).
      - name: Staging — noindex (robots + sitemap + meta)
        if: needs.determine-env.outputs.app_env == 'dev'
        run: |
          cp web/robots.staging.txt build/web/robots.txt
          rm -f build/web/sitemap.xml
          sed -i 's/content="index, follow"/content="noindex, nofollow"/' build/web/index.html
          echo "Staging noindex appliqué : robots.txt=Disallow, sitemap retiré, meta robots=noindex."

      # Déploiement Firebase Hosting via firebase-tools CLI direct.
      #
      # Pourquoi PAS l'action FirebaseExtended/action-hosting-deploy@v0 :
      # cette action a un bug connu de retry handling — sur erreur réseau
      # « premature close » pendant le POST /channels/<ch>/releases, le
      # client retry, mais le 1er POST a en fait réussi côté serveur. Le 2e
      # POST reçoit HTTP 400 FAILED_PRECONDITION « supplied version ... is
      # the current active version ». L'action exit 1 alors que le contenu
      # EST déployé. Observé 4× consécutivement sur develop le 2026-06-30
      # (runs 28457605436, 28462827564, 28464397651, 28465482241).
      #
      # Tentative précédente de tolerance via parsing des logs cross-step
      # (gh run view --log / gh api .../jobs/{id}/logs) abandonnée car
      # GitHub Actions n'expose PAS les logs d'un run/job in-progress —
      # l'endpoint zip-archive ne sert qu'après fin du run.
      #
      # Solution adoptée : on appelle firebase-tools nous-mêmes dans la même
      # step, on capture stderr inline, on grep dans la même bash session.
      # Si l'erreur est exactement la signature retry race connue, on succeed
      # avec un warning (le contenu est déployé, c'est juste un faux fail).
      # Toute autre erreur fait remonter l'exit code.
      #
      # À retirer / simplifier dès que firebase-tools patche son retry —
      # suivre https://github.com/firebase/firebase-tools/issues
      - name: Deploy to Firebase Hosting
        id: firebase_deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CHANNEL: ${{ needs.determine-env.outputs.firebase_channel }}
        run: |
          set +e
          # Service account credentials (Google Application Default Credentials).
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          OUT="$RUNNER_TEMP/firebase-deploy.log"

          # Channel "live" = production (commande différente).
          if [ "$FIREBASE_CHANNEL" = "live" ]; then
            npx -y firebase-tools@latest deploy --only hosting \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive 2>&1 | tee "$OUT"
            EXIT=${PIPESTATUS[0]}
          else
            npx -y firebase-tools@latest hosting:channel:deploy "$FIREBASE_CHANNEL" \
              --expires 7d \
              --project "$FIREBASE_PROJECT_ID" \
              --non-interactive 2>&1 | tee "$OUT"
            EXIT=${PIPESTATUS[0]}
          fi

          # Cleanup credentials immédiatement (defense in depth).
          rm -f "$SA_FILE"

          if [ $EXIT -eq 0 ]; then
            exit 0
          fi

          # Exit non-zero : on regarde si c'est le retry race connu.
          if grep -qF "is the current active version" "$OUT"; then
            echo "::warning::Firebase retry-race detected (FAILED_PRECONDITION 'current active version'). Content WAS deployed — the first POST succeeded server-side; only the retry POST failed. Treating job as success."
            exit 0
          fi

          # Toute autre erreur propage.
          echo "::error::Firebase deploy failed for an UNKNOWN reason (not the retry race). See log above."
          exit $EXIT

      # Loggue l'URL du channel après un deploy réussi (ou toléré). La CLI
      # firebase-tools n'imprime PAS l'URL du channel quand le POST /releases
      # errore (retry race), donc on la récupère via channel:list — l'URL du
      # channel est stable dans le temps (hash aléatoire assigné à la
      # création, jamais rechangé). Le CLI channel:list ne fait qu'un GET
      # inoffensif, aucun risque même si le déploiement principal a hoqueté.
      - name: Log Firebase channel URL
        if: always() && steps.firebase_deploy.outcome != 'skipped'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CHANNEL: ${{ needs.determine-env.outputs.firebase_channel }}
          FIREBASE_ENV_NAME: ${{ needs.determine-env.outputs.env_name }}
        run: |
          set +e
          SA_FILE="$RUNNER_TEMP/firebase-sa-url.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          if [ "$FIREBASE_CHANNEL" = "live" ]; then
            URL="https://$FIREBASE_PROJECT_ID.web.app"
          else
            URL=$(npx -y firebase-tools@latest hosting:channel:list \
              --project "$FIREBASE_PROJECT_ID" --json 2>/dev/null \
              | jq -r --arg ch "$FIREBASE_CHANNEL" '.result.channels[] | select(.name | endswith("/channels/" + $ch)) | .url' \
              | head -n1)
          fi

          rm -f "$SA_FILE"

          if [ -n "$URL" ] && [ "$URL" != "null" ]; then
            echo "::notice title=Deploy URL::$FIREBASE_ENV_NAME → $URL"
            {
              echo "## Deploy — $FIREBASE_ENV_NAME"
              echo ""
              echo "**Channel** : \`$FIREBASE_CHANNEL\`"
              echo "**URL** : $URL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not resolve channel URL for $FIREBASE_CHANNEL — check Firebase Console."
          fi

      # Marque la release APRÈS un deploy prod réussi : crée le tag annoté
      # vX.Y.Z (codename gravé) + la GitHub Release. C'est la SEULE écriture git
      # de la release — aucun commit sur main (verrouillée), juste un tag +
      # une Release. Staging (develop) ne tague jamais.
      #
      # Même politique que le step « Deploy to Firebase Hosting » ci-dessus :
      # on tolère UNE signature d'erreur connue et bénigne, on propage tout le
      # reste. Le cas toléré est la COLLISION de tag : release.sh calcule un tag
      # qui existe déjà et sort en « le tag vX.Y.Z existe déjà ».
      #
      # ⚠️ Ce garde-fou ne couvre PAS le re-run du workflow sur un SHA déjà
      # publié : `version.sh next auto` re-bumpe (patch) même avec 0 commit dans
      # le range, donc un re-run calcule un tag NEUF (v1.0.0 → v1.0.1) et crée
      # une release fantôme au changelog vide au lieu de lever « existe déjà ».
      # Le pipeline n'est donc PAS idempotent — c'est un bug distinct, à traiter
      # dans version.sh/release.sh (refuser de taguer si range vide), pas ici.
      #
      # Pourquoi ne PAS avaler les autres erreurs (l'ancien `|| echo ::warning`
      # le faisait) : le tag n'est pas décoratif, c'est la base de calcul de la
      # release SUIVANTE. version.sh dérive la prochaine version depuis
      # `git describe --tags` ; un tag silencieusement manquant fait repartir le
      # range du mauvais point → bump faux et changelog faux à la release d'après.
      # Un échec de push/gh/release.sh doit donc être visible immédiatement, pas
      # noyé dans un warning jaune sur un run vert.
      #
      # La prod EST déployée quand ce step tourne (il dépend de
      # firebase_deploy.outcome == 'success') : un échec ici = release à taguer
      # à la main, PAS une prod cassée. Le message d'erreur le dit explicitement
      # pour éviter un re-deploy réflexe.
      - name: Tag release (prod only)
        if: needs.determine-env.outputs.app_env == 'prod' && steps.firebase_deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/release.log"
          bash tool/release/release.sh auto --push --gh-release --ci 2>&1 | tee "$OUT"
          EXIT=${PIPESTATUS[0]}

          if [ "$EXIT" -eq 0 ]; then
            exit 0
          fi

          # Seul cas toléré — signature émise par release.sh :
          #   « release.sh: le tag vX.Y.Z existe déjà — rien à faire. »
          if grep -qF "existe déjà" "$OUT"; then
            echo "::warning::Tag/Release déjà existant — prod déployée, rien à faire."
            exit 0
          fi

          echo "::error title=Release::release.sh a échoué pour une raison INCONNUE (ce n'est PAS le cas « tag déjà existant ») — voir le log ci-dessus. La PROD EST DÉPLOYÉE : ne pas re-deployer. Créer le tag à la main puis investiguer, sinon le bump de la prochaine release sera faux."
          exit "$EXIT"
