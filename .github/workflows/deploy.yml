name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: 'Force target (dev or prod)'
        required: false
        type: choice
        options:
          - auto
          - dev
          - prod
        default: auto

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  determine-env:
    name: Determine target environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      app_env: ${{ steps.set.outputs.app_env }}
      # Cible Hosting multi-site (.firebaserc) : `prod` = site easy-rent-54cd4
      # (baillan.com), `stage` = site baillan-stage (stage.baillan.com).
      hosting_target: ${{ steps.set.outputs.hosting_target }}
      public_url: ${{ steps.set.outputs.public_url }}
      # Abonnement Pro (checkout Stripe) : OUVERT en staging pour continuer le
      # développement, FERMÉ en production tant que la beta v1 freemium tourne
      # (Stripe attend les infos de la micro-entreprise). Cf. Env.subscriptionsEnabled.
      # Le défaut côté Dart est `false` : si cette sortie disparaissait, la prod
      # resterait bloquée (mode d'échec sûr).
      subscriptions_enabled: ${{ steps.set.outputs.subscriptions_enabled }}
      # Cibles `firebase deploy --only` de CET environnement, base Firestore
      # COMPRISE (ADR 0003). Le ciblage par base est ce qui empêche un push sur
      # `develop` de pousser des rules en production : `firestore:staging` ne
      # touche que la base `staging`, `firestore:(default)` que la prod.
      # ⚠️ Ne JAMAIS remplacer par `firestore` tout court — sans filtre, la CLI
      # déploie sur les DEUX bases déclarées dans firebase.json.
      deploy_targets: ${{ steps.set.outputs.deploy_targets }}
    steps:
      - id: set
        run: |
          OVERRIDE="${{ github.event.inputs.target }}"
          BRANCH="${{ github.ref_name }}"
          # Sur un `push` (pas un workflow_dispatch), inputs.target est VIDE —
          # on le traite comme "auto" pour que la détection par branche joue.
          # Sans ça, un push sur `main` retombait dans le `else` → déploiement
          # STAGING au lieu de PROD (bug corrigé 2026-07-05 : release #65
          # déployée à la main faute de ce fix).
          [ -z "$OVERRIDE" ] && OVERRIDE="auto"

          if [ "$OVERRIDE" = "prod" ] || ([ "$OVERRIDE" = "auto" ] && [ "$BRANCH" = "main" ]); then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "app_env=prod" >> $GITHUB_OUTPUT
            echo "hosting_target=prod" >> $GITHUB_OUTPUT
            echo "public_url=https://baillan.com" >> $GITHUB_OUTPUT
            # PROD : abonnement Pro FERMÉ pendant la beta v1 (ouverture ~2026-08-25).
            echo "subscriptions_enabled=false" >> $GITHUB_OUTPUT
            # Rules + indexes sur la base de PROD uniquement, plus les rules
            # Storage : le bucket est unique (partagé avec staging), donc il ne
            # se déploie que depuis `main` — jamais depuis `develop`.
            echo 'deploy_targets=hosting:prod,hosting:marketing,firestore:(default),storage' >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "app_env=dev" >> $GITHUB_OUTPUT
            echo "hosting_target=stage" >> $GITHUB_OUTPUT
            echo "public_url=https://app.staging.baillan.com" >> $GITHUB_OUTPUT
            # STAGING : abonnement Pro OUVERT pour poursuivre le développement.
            echo "subscriptions_enabled=true" >> $GITHUB_OUTPUT
            # Rules + indexes sur la base `staging` UNIQUEMENT. Ni `storage`
            # (bucket partagé) ni `functions` (déploiement unique servant aussi
            # la prod) — les ajouter ici ferait fuir du code non relu en prod à
            # chaque push sur `develop`. Cf. ADR 0003, « Limitations assumées ».
            echo "deploy_targets=hosting:stage,hosting:marketing-stage,firestore:staging" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    name: Build & Deploy (${{ needs.determine-env.outputs.env_name }})
    needs: determine-env
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.env_name }}
    permissions:
      contents: write # push du tag vX.Y.Z + GitHub Release (uniquement en prod)
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 → historique complet + tags. Indispensable pour la
          # dérivation de version (git describe + rev-list --count) des steps
          # « Determine version » et « Tag release ». Le checkout shallow par
          # défaut casserait les deux.
          fetch-depth: 0

      # `flutter-version` ÉPINGLÉE, comme dans `ci.yml` — ne pas retirer.
      #
      # Incident du 2026-08-13 : ce workflow ne l'épinglait pas et suivait donc
      # le canal `stable`. Une nouvelle version de Flutter est sortie dans la
      # nuit ; son SDK analyse la syntaxe « raccourci point » et produit un
      # nœud d'AST que l'`analyzer` résolu pour ce projet ne sait pas visiter :
      #   Exception: Missing implementation of visitDotShorthandPropertyAccess
      # `build_runner` plantait, l'étape restait bloquée six heures, et le
      # groupe de concurrence retenait tous les déploiements derrière elle.
      #
      # Le symptôme trompait : `ci.yml`, LUI épinglé, restait vert sur le même
      # commit. On cherche donc un défaut de code qui n'existe pas — alors que
      # la seule différence entre les deux workflows était cette ligne.
      #
      # Toute montée de version doit se faire ICI ET dans `ci.yml`, ensemble :
      # deux workflows sur des SDK différents, c'est un vert qui ne prouve rien
      # sur ce qui sera réellement déployé.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Install deps
        run: flutter pub get

      # `timeout-minutes` ajouté le 2026-08-13 après un incident : cette étape
      # s'est bloquée ici pendant SIX heures, jusqu'à la limite globale de
      # GitHub Actions, avant d'être annulée — puis le déploiement suivant a
      # repris exactement le même blocage. Pendant ce temps le groupe de
      # concurrence retenait tous les déploiements en file, et rien ne
      # signalait quoi que ce soit : le workflow paraissait simplement « en
      # cours ».
      #
      # Ce n'était PAS un défaut de code — le job `analyze-test` de `ci.yml`
      # exécutait la commande identique, sur le même commit, en une dizaine de
      # minutes. Incident d'infrastructure, donc, mais sans borne il coûte une
      # nuit entière et masque l'état réel de staging.
      #
      # 15 min laisse une marge confortable (l'exécution nominale tient en
      # quelques minutes) tout en transformant un blocage en échec explicite.
      - name: Generate code (freezed / json_serializable)
        timeout-minutes: 15
        run: dart run build_runner build --delete-conflicting-outputs

      # Dérive la version depuis git (tags + nb de commits) — voir
      # tool/release/version.sh. En PROD on calcule la PROCHAINE version (bump
      # déduit des commits conventionnels) ; en STAGING on reflète la dernière
      # version publiée + le nb de commits de develop (build number plus haut →
      # identifie le build staging). Rien n'est stocké dans un fichier édité par
      # branche → aucun conflit de version.
      - name: Determine version
        id: ver
        run: |
          if [ "${{ needs.determine-env.outputs.app_env }}" = "prod" ]; then
            NAME="$(bash tool/release/version.sh next auto)"
            CODENAME="$(bash tool/release/version.sh codename-next auto)"
          else
            NAME="$(bash tool/release/version.sh name)"
            CODENAME="$(bash tool/release/version.sh codename)"
          fi
          CODE="$(bash tool/release/version.sh code)"
          echo "name=$NAME"         >> "$GITHUB_OUTPUT"
          echo "code=$CODE"         >> "$GITHUB_OUTPUT"
          echo "codename=$CODENAME" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::$NAME+$CODE « $CODENAME » (${{ needs.determine-env.outputs.app_env }})"

      - name: Build web (release)
        # En staging on désactive le service worker pour éviter le piège de cache PWA
        # quand un nouveau build est déployé (l'ancien SW continue sinon de servir l'ancien
        # bundle pendant des heures, même après hard reload). En production on garde le SW
        # par défaut (offline-first) — comportement PWA attendu pour les utilisateurs réels.
        #
        # Firebase config (apiKey, projectId, etc.) est embarquée dans
        # lib/firebase_options.dart — pas besoin de dart-defines (les Firebase
        # Web keys sont publiques par design, sécurité via Rules + App Check).
        # --build-name / --build-number : version dérivée de git (step
        # « Determine version ») → version.json (web) et versionCode/versionName
        # (mobile) → Profil → À propos. Le build number = nb de commits, donc
        # strictement croissant (contrainte stores satisfaite).
        # --pwa-strategy=none sur les DEUX environnements : index.html porte un
        # script qui désenregistre tout Service Worker (héritage FEAT-019, fix
        # cache-poisoning). Tant que ce script est présent, prod DOIT aussi être
        # SW-less — sinon le SW prod est tué à chaque session (churn + reload).
        # Réactiver l'offline-first = retirer d'abord ce script d'index.html.
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --dart-define=APP_ENV=${{ needs.determine-env.outputs.app_env }} \
            --dart-define=SUBSCRIPTIONS_ENABLED=${{ needs.determine-env.outputs.subscriptions_enabled }} \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.code }}

      # SEO (FEAT-049/FEAT-050) — l'app Flutter n'est plus indexable nulle
      # part, prod comme staging : `web/robots.txt` (source) est en Disallow
      # global et `web/index.html` a pour défaut `noindex, nofollow` — les
      # deux facts que ce step ré-appliquait ci-dessous sont donc déjà vrais
      # AVANT même que ce step ne tourne, quel que soit l'environnement. La
      # PROD ne "saute" plus rien : elle sert exactement le même noindex que
      # staging, ce qui élimine l'asymétrie de risque qu'il y avait avant
      # FEAT-050 (quand le défaut prod était "index, follow" et que seule
      # staging le corrigeait ici).
      # Ce step est donc redondant en pratique (`cp`/`rm -f`/`sed` n'ont plus
      # rien à changer) et ne reste que comme filet de sécurité idempotent :
      # si un futur diff réintroduit par erreur un défaut "index, follow"
      # dans `web/index.html`, ce step continue de forcer le noindex sur les
      # builds staging (mais pas sur prod, qui n'a plus ce filet — la vraie
      # garantie prod est le défaut de `web/index.html` lui-même).
      # firebase.json est par ailleurs partagé entre le channel live et les
      # channels de preview, donc un header X-Robots-Tag par-canal reste
      # impossible : `web/robots.staging.txt` documente ce cas côté fichier
      # servi, même si son contenu (Disallow global) est désormais identique
      # à celui de `web/robots.txt`.
      - name: Staging — noindex (robots + sitemap + meta)
        if: needs.determine-env.outputs.app_env == 'dev'
        run: |
          cp web/robots.staging.txt build/web/robots.txt
          rm -f build/web/sitemap.xml
          sed -i 's/content="index, follow"/content="noindex, nofollow"/' build/web/index.html
          echo "Staging noindex vérifié : robots.txt=Disallow, sitemap absent, meta robots=noindex."

      # `site/package.json` (FEAT-050, vitrine Astro) déclare
      # `engines.node: ">=22.12.0"`. Sans ce step, le job hérite du Node par
      # défaut du runner `ubuntu-latest` — non garanti, non documenté, et ce
      # job n'avait jamais utilisé Node avant ce diff. `node-version: "22"`
      # (majeure seule, comme les jobs Node de `ci.yml`) plutôt qu'un patch
      # exact : n'importe quelle 22.x que `actions/setup-node` installe est
      # déjà >= 22.12.0, donc pas besoin de la faire suivre manuellement comme
      # `flutter-version` ci-dessus. Ne PAS copier `node-version: "20"` des
      # jobs Node de `ci.yml` — Astro 7 exige >= 22.12.0, "20" échouerait au
      # premier `npm ci --prefix site`.
      # Ce step (et « Build marketing site » ci-dessous) est dans le même job
      # séquentiel que le déploiement Hosting/Firestore/Storage de prod : un
      # échec ici bloque tout le déploiement de l'app Flutter avec lui, alors
      # que les deux étaient découplés avant ce diff. Accepté sciemment (cf.
      # task-3-report.md) : le site marketing partage le même `deploy_targets`
      # et la même release que l'app.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build marketing site
        # SITE_ENV=staging fait basculer site/src/pages/robots.txt.ts (Task 7,
        # FEAT-050) en Disallow global sur `develop`. La cible d'hébergement
        # `marketing-stage` sert déjà `X-Robots-Tag: noindex, nofollow` sur
        # tout (firebase.json) ; ce robots.txt est une deuxième ceinture pour
        # qu'un explorateur ne perde même pas son temps à récupérer les pages.
        # Vide sur `main` (prod) : la vitrine reste indexable.
        env:
          SITE_ENV: ${{ needs.determine-env.outputs.app_env == 'dev' && 'staging' || '' }}
        run: npm ci --prefix site && npm run build --prefix site

      # Garde-fou (Task 5, FEAT-050) : l'URL du formulaire Tally d'idées ne
      # doit plus être le placeholder `https://tally.so/` (racine, sans
      # formulaire) une fois en PRODUCTION. Le même SITE_ENV que le build
      # ci-dessus est repassé ici : staging tolère le placeholder, prod
      # l'exige renseigné (site/src/lib/links.ts). Volontairement APRÈS le
      # build (pas avant) — ce n'est pas un pré-requis de compilation, juste
      # un refus explicite de déployer un lien mort en prod plutôt qu'un
      # échec silencieux du script check-vitrine-idea-url.sh découvert plus
      # tard. Câblé ici et PAS dans le job `site` de ci.yml : ce dernier
      # tourne sur chaque PR en mode prod et bloquerait toute PR tant que
      # l'URL Tally réelle n'existe pas.
      - name: Check idea form URL (prod enforces, staging tolerates)
        env:
          SITE_ENV: ${{ needs.determine-env.outputs.app_env == 'dev' && 'staging' || '' }}
        run: bash scripts/check-vitrine-idea-url.sh

      # Déploiement Firebase Hosting via firebase-tools CLI direct.
      #
      # Pourquoi PAS l'action FirebaseExtended/action-hosting-deploy@v0 :
      # cette action a un bug connu de retry handling — sur erreur réseau
      # « premature close » pendant le POST /channels/<ch>/releases, le
      # client retry, mais le 1er POST a en fait réussi côté serveur. Le 2e
      # POST reçoit HTTP 400 FAILED_PRECONDITION « supplied version ... is
      # the current active version ». L'action exit 1 alors que le contenu
      # EST déployé. Observé 4× consécutivement sur develop le 2026-06-30
      # (runs 28457605436, 28462827564, 28464397651, 28465482241).
      #
      # Tentative précédente de tolerance via parsing des logs cross-step
      # (gh run view --log / gh api .../jobs/{id}/logs) abandonnée car
      # GitHub Actions n'expose PAS les logs d'un run/job in-progress —
      # l'endpoint zip-archive ne sert qu'après fin du run.
      #
      # Solution adoptée : on appelle firebase-tools nous-mêmes dans la même
      # step, on capture stderr inline, on grep dans la même bash session.
      # Si l'erreur est exactement la signature retry race connue, on succeed
      # avec un warning (le contenu est déployé, c'est juste un faux fail).
      # Toute autre erreur fait remonter l'exit code.
      #
      # À retirer / simplifier dès que firebase-tools patche son retry —
      # suivre https://github.com/firebase/firebase-tools/issues
      - name: Deploy to Firebase (hosting + Firestore rules/indexes)
        id: firebase_deploy
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          DEPLOY_TARGETS: ${{ needs.determine-env.outputs.deploy_targets }}
        run: |
          set +e
          # Service account credentials (Google Application Default Credentials).
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"

          OUT="$RUNNER_TEMP/firebase-deploy.log"

          # Multi-site : les DEUX environnements déploient sur le canal `live`
          # de LEUR site (cible .firebaserc), plus de preview channel. Un
          # preview channel ne peut pas porter de domaine personnalisé — c'est
          # ce qui imposait le site dédié `baillan-stage` pour stage.baillan.com.
          #
          # $DEPLOY_TARGETS embarque AUSSI la base Firestore de l'environnement
          # (`firestore:staging` ou `firestore:(default)`) : avant, rules et
          # indexes n'étaient poussés qu'à la main, donc l'app pouvait tourner
          # sur des rules plus vieilles que le code déployé à côté.
          # Garde-fou : si la sortie deploy_targets manquait, on n'improvise pas
          # un `deploy` sans filtre (qui viserait les deux bases) — on échoue.
          if [ -z "$DEPLOY_TARGETS" ]; then
            echo "::error::deploy_targets vide — refus de déployer sans filtre --only (risque de pousser sur la base de prod)."
            exit 1
          fi

          npx -y firebase-tools@latest deploy --only "$DEPLOY_TARGETS" \
            --project "$FIREBASE_PROJECT_ID" \
            --non-interactive 2>&1 | tee "$OUT"
          EXIT=${PIPESTATUS[0]}

          # Cleanup credentials immédiatement (defense in depth).
          rm -f "$SA_FILE"

          if [ $EXIT -eq 0 ]; then
            exit 0
          fi

          # Exit non-zero : on regarde si c'est le retry race connu.
          #
          # ⚠️ Ce bypass ne doit couvrir QUE la race Hosting. Depuis qu'on
          # déploie aussi firestore/storage dans la MÊME commande, un échec de
          # rules serait masqué si la race Hosting survenait en même temps — on
          # publierait alors une CI verte avec des rules non déployées, soit
          # exactement le mode de panne silencieux que ce workflow doit éliminer.
          # On n'accepte donc le bypass que si TOUTES les erreurs du log sont
          # cette race (et jamais s'il n'y en a aucune de reconnue).
          ERR_TOTAL=$(grep -c "Error:" "$OUT" || true)
          ERR_RACE=$(grep "Error:" "$OUT" | grep -c "is the current active version" || true)
          if [ "${ERR_TOTAL:-0}" -gt 0 ] && [ "${ERR_TOTAL:-0}" -eq "${ERR_RACE:-0}" ]; then
            echo "::warning::Firebase retry-race detected (FAILED_PRECONDITION 'current active version'), and it is the ONLY error in the log. Content WAS deployed — the first POST succeeded server-side; only the retry POST failed. Treating job as success."
            exit 0
          fi

          if [ "${ERR_RACE:-0}" -gt 0 ]; then
            echo "::error::Retry-race Hosting détectée MAIS d'autres erreurs sont présentes ($ERR_TOTAL erreurs, dont $ERR_RACE races) — probable échec du déploiement firestore/storage. On échoue volontairement plutôt que de masquer des rules non déployées."
            exit $EXIT
          fi

          # Toute autre erreur propage.
          echo "::error::Firebase deploy failed for an UNKNOWN reason (not the retry race). See log above."
          exit $EXIT

      # Multi-site : chaque environnement a une URL FIXE (domaine personnalisé
      # attaché au canal live de son site). Plus besoin d'interroger
      # `hosting:channel:list` pour récupérer une URL de preview à hash
      # aléatoire — l'ancien code de résolution a donc été supprimé.
      - name: Log deploy URL
        if: always() && steps.firebase_deploy.outcome != 'skipped'
        env:
          FIREBASE_ENV_NAME: ${{ needs.determine-env.outputs.env_name }}
          HOSTING_TARGET: ${{ needs.determine-env.outputs.hosting_target }}
          PUBLIC_URL: ${{ needs.determine-env.outputs.public_url }}
        run: |
          echo "::notice title=Deploy URL::$FIREBASE_ENV_NAME → $PUBLIC_URL"
          {
            echo "## Deploy — $FIREBASE_ENV_NAME"
            echo ""
            echo "**Cible Hosting** : \`$HOSTING_TARGET\`"
            echo "**URL** : $PUBLIC_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # Marque la release APRÈS un deploy prod réussi : crée le tag annoté
      # vX.Y.Z (codename gravé) + la GitHub Release. C'est la SEULE écriture git
      # de la release — aucun commit sur main (verrouillée), juste un tag +
      # une Release. Staging (develop) ne tague jamais.
      #
      # Même politique que le step « Deploy to Firebase Hosting » ci-dessus :
      # on tolère des signatures d'erreur connues et bénignes, on propage tout
      # le reste. Deux cas tolérés, tous deux émis par release.sh :
      #   - RIEN À PUBLIER : aucun commit depuis le dernier tag → HEAD est déjà
      #     publié. C'est le cas d'un « Re-run all jobs » sur un SHA déjà
      #     released : la prod est re-déployée à l'identique, aucun tag à créer.
      #   - COLLISION de tag : release.sh calcule un tag qui existe déjà.
      #
      # Le re-run est idempotent : `version.sh next` ne bumpe plus quand le
      # range est vide, donc le build porte le même label que la release en
      # place (et non une 1.0.1 fantôme), et release.sh refuse de taguer.
      #
      # Pourquoi ne PAS avaler les autres erreurs (l'ancien `|| echo ::warning`
      # le faisait) : le tag n'est pas décoratif, c'est la base de calcul de la
      # release SUIVANTE. version.sh dérive la prochaine version depuis
      # `git describe --tags` ; un tag silencieusement manquant fait repartir le
      # range du mauvais point → bump faux et changelog faux à la release d'après.
      # Un échec de push/gh/release.sh doit donc être visible immédiatement, pas
      # noyé dans un warning jaune sur un run vert.
      #
      # La prod EST déployée quand ce step tourne (il dépend de
      # firebase_deploy.outcome == 'success') : un échec ici = release à taguer
      # à la main, PAS une prod cassée. Le message d'erreur le dit explicitement
      # pour éviter un re-deploy réflexe.
      - name: Tag release (prod only)
        if: needs.determine-env.outputs.app_env == 'prod' && steps.firebase_deploy.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          OUT="$RUNNER_TEMP/release.log"
          bash tool/release/release.sh auto --push --gh-release --ci 2>&1 | tee "$OUT"
          EXIT=${PIPESTATUS[0]}

          if [ "$EXIT" -eq 0 ]; then
            exit 0
          fi

          # Cas tolérés — signatures émises par release.sh (ne pas les
          # reformuler d'un côté sans l'autre) :
          #   « release.sh: rien à publier — aucun commit depuis vX.Y.Z … »
          if grep -qF "rien à publier" "$OUT"; then
            echo "::warning::Aucun commit depuis le dernier tag — rien à publier. Prod re-déployée à l'identique, aucune release créée (comportement attendu d'un re-run)."
            exit 0
          fi
          #   « release.sh: le tag vX.Y.Z existe déjà — rien à faire. »
          if grep -qF "existe déjà" "$OUT"; then
            echo "::warning::Tag/Release déjà existant — prod déployée, rien à faire."
            exit 0
          fi

          echo "::error title=Release::release.sh a échoué pour une raison INCONNUE (ce n'est NI « rien à publier » NI « tag déjà existant ») — voir le log ci-dessus. La PROD EST DÉPLOYÉE : ne pas re-deployer. Créer le tag à la main puis investiguer, sinon le bump de la prochaine release sera faux."
          exit "$EXIT"
