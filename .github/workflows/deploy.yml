name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      target:
        description: 'Force target (dev or prod)'
        required: false
        type: choice
        options:
          - auto
          - dev
          - prod
        default: auto

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  determine-env:
    name: Determine target environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set.outputs.env_name }}
      app_env: ${{ steps.set.outputs.app_env }}
      firebase_channel: ${{ steps.set.outputs.firebase_channel }}
    steps:
      - id: set
        run: |
          OVERRIDE="${{ github.event.inputs.target }}"
          BRANCH="${{ github.ref_name }}"

          if [ "$OVERRIDE" = "prod" ] || ([ "$OVERRIDE" = "auto" ] && [ "$BRANCH" = "main" ]); then
            echo "env_name=production" >> $GITHUB_OUTPUT
            echo "app_env=prod" >> $GITHUB_OUTPUT
            echo "firebase_channel=live" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
            echo "app_env=dev" >> $GITHUB_OUTPUT
            echo "firebase_channel=staging" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    name: Build & Deploy (${{ needs.determine-env.outputs.env_name }})
    needs: determine-env
    runs-on: ubuntu-latest
    environment: ${{ needs.determine-env.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Generate code (freezed / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web (release)
        # En staging on désactive le service worker pour éviter le piège de cache PWA
        # quand un nouveau build est déployé (l'ancien SW continue sinon de servir l'ancien
        # bundle pendant des heures, même après hard reload). En production on garde le SW
        # par défaut (offline-first) — comportement PWA attendu pour les utilisateurs réels.
        #
        # Firebase config (apiKey, projectId, etc.) est embarquée dans
        # lib/firebase_options.dart — pas besoin de dart-defines (les Firebase
        # Web keys sont publiques par design, sécurité via Rules + App Check).
        run: |
          flutter build web --release \
            ${{ needs.determine-env.outputs.env_name == 'staging' && '--pwa-strategy=none' || '' }} \
            --dart-define=APP_ENV=${{ needs.determine-env.outputs.app_env }}

      - name: Deploy to Firebase Hosting
        id: firebase_deploy
        # Voir step suivant — on tolère un cas d'erreur précis et SEUL (retry race
        # connu de l'action upstream). Toute autre erreur est propagée par la step
        # de tolérance.
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: ${{ needs.determine-env.outputs.firebase_channel }}

      # Bug retry race de FirebaseExtended/action-hosting-deploy@v0 :
      #
      # Symptôme : le client retry son POST /channels/<channel>/releases sur erreur
      # réseau (« premature close »), mais le 1er POST a en fait réussi côté
      # serveur Firebase. Le 2e POST reçoit alors HTTP 400 FAILED_PRECONDITION
      # « supplied version ... is the current active version ». L'action exit 1
      # alors que le contenu est bel et bien déployé sur le channel.
      #
      # Observé sur develop le 2026-06-30 (commits f541d92 et 0fa3bce). Pour ne
      # pas masquer les vrais fails, on grep le log du job courant : si
      # exactement cette signature d'erreur apparaît, on succeed avec un warning.
      # Toute autre cause d'échec laisse le job en fail.
      #
      # À retirer dès que l'action upstream patche son retry handling — suivre :
      # https://github.com/FirebaseExtended/action-hosting-deploy/issues
      - name: Tolerate Firebase retry-race FAILED_PRECONDITION
        if: steps.firebase_deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # On parse les logs du run courant. La signature ciblée vient de
          # firebase-tools (Firebase Hosting REST API) — assez précise pour
          # qu'aucune autre erreur n'y matche par accident.
          # `gh run view --log` renvoie 0 octet sur un run encore in-progress
          # (l'endpoint sous-jacent ne sert le zip d'archives qu'après fin du run).
          # On passe par l'endpoint per-job qui, lui, expose les logs des steps
          # déjà terminées même quand le job parent tourne encore.
          JOB_ID=$(gh run view "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --json jobs \
            --jq '.jobs[] | select(.name | startswith("Build & Deploy")) | .databaseId')
          if [ -z "$JOB_ID" ]; then
            echo "::error::Tolerance step could not locate the deploy job ID."
            exit 1
          fi
          LOGS=$(gh api "repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" 2>/dev/null || true)
          echo "Fetched $(echo -n "$LOGS" | wc -c) bytes of job log."
          # Phrase exclusive à l'erreur Firebase Hosting REST API quand on tente
          # de release une version déjà active sur le channel. Aucune autre
          # erreur n'utilise cette tournure exacte.
          if echo "$LOGS" | grep -qF "is the current active version"; then
            echo "::warning::Firebase retry-race detected (known upstream bug). Content WAS deployed — treating job as success."
            exit 0
          else
            echo "::error::Firebase deploy failed for a reason OTHER than the known retry race. Inspect the deploy step logs."
            exit 1
          fi
