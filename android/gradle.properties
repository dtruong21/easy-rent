# JVM du démon Gradle. 6G (au lieu de 8G) + metaspace 2G : libère de la RAM
# pour le compilateur Dart AOT / Xcode / cache OS, meilleur throughput GC.
# ⚠️ Si un gros build release (R8 + Firebase) fait OOM, remonter -Xmx à 8G.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true

# Accélération build (Gradle 8.14 / AGP 8.11) — gains « à froid » (worktree
# neuf) comme « à chaud » :
#   caching   : réutilise les sorties de tâches (compile Kotlin, R-class, AAR)
#               entre builds / worktrees — le plus gros levier ici.
#   parallel  : compile en parallèle les ~10 sous-projets des plugins Firebase.
#   kotlin.incremental : déjà défaut Kotlin 2.x, épinglé par sécurité.
# ⚠️ NE PAS activer org.gradle.configuration-cache (plugin Flutter pas encore
# compatible — flutter#155484) ni configureondemand (instable sur graphe Flutter).
org.gradle.caching=true
org.gradle.parallel=true
kotlin.incremental=true
