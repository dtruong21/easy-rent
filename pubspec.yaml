name: easyrent
description: "Baillan. — Tenir registre. En cas de doute, sortez le registre. (FEAT-020 : rebrand EasyRent → Baillan ; package name interne conservé pour éviter de casser ~200 imports `package:easyrent/...`)"
publish_to: 'none'
# Versioning : MAJOR.MINOR.PATCH+BUILD (semver).
# - version sémantique : bumpée à la main à chaque lot fonctionnel notable
#   (1.0.0 = MVP complet, juillet 2026)
# - +BUILD : écrasé au build par --build-number (CI : run_number GitHub,
#   local : git rev-list --count HEAD) → identifie le déploiement exact.
# Affichée dans Profil → À propos (package_info_plus lit version.json sur
# le web ; lira le manifest natif sur iOS/Android).
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  # URL strategy path-based web (FEAT-045 — URL /delete-account fiche Play)
  flutter_web_plugins:
    sdk: flutter

  # i18n (FEAT-043 — support FR/EN via gen_l10n officiel, ARB). Widgets natifs
  # localisés gratuitement (showDatePicker, MaterialLocalizations…).
  flutter_localizations:
    sdk: flutter

  # Firebase (FEAT-019 — migration achevée)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3
  # Rapport d'incident MOBILE (iOS/Android — pas de support web). Ligne 4.x :
  # la 5.x exige firebase_core ^4 (incompatible). Collecte opt-in RGPD, off par
  # défaut (cf. lib/core/observability/, Info.plist, AndroidManifest).
  firebase_crashlytics: ^4.3.10

  # State management
  flutter_riverpod: ^2.6.0

  # Navigation
  go_router: ^14.6.0

  # Modèles immutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # PDF
  pdf: ^3.11.0

  # i18n / locale FR + EN (FEAT-043). Version pinnée par flutter_localizations
  # (SDK) — voir contrainte transitive lors de `flutter pub get`.
  intl: ^0.20.2

  # Logging
  logging: ^1.3.0

  # Utilities
  uuid: ^4.5.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  file_picker: ^11.0.2
  mime: ^2.0.0

  # Dashboard charts
  fl_chart: ^0.69.0

  # PWA install prompt dismiss persistence
  shared_preferences: ^2.3.5

  # SVG rendering (logo Google officiel sur les boutons d'auth)
  flutter_svg: ^2.0.10+1

  # JS interop (install prompt bridge)
  web: ^1.1.0
  package_info_plus: ^9.0.1

  # Partage natif Android/iOS des PDF quittances/régularisations (FEAT-024).
  # Remonte l'annulation du share sheet (dismissed) — requis pour l'invariant
  # « sent_at après partage réussi ».
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # SHA-256 de config/entitlements.json (FEAT-056) — utilisé par
  # tool/gen_entitlements.dart pour estampiller le miroir Dart généré, et par
  # scripts/check-entitlements-parity.sh pour comparer les deux miroirs.
  # Dev-only : rien dans lib/ n'importe crypto (le SHA est un littéral généré).
  crypto: ^3.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  firebase_auth_mocks: ^0.14.2
  fake_cloud_firestore: ^3.1.0
  # Faux lanceur d'URL pour tester les actions tel:/mailto: (déjà transitifs
  # via url_launcher — déclarés ici pour pouvoir les importer en test).
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8

  # Icônes d'app natives Baillan (iOS + Android) — génère mipmaps + AppIcon
  # + icône adaptative depuis un master unique. Régénérer avec :
  #   dart run flutter_launcher_icons
  # Le master lui-même est reproductible depuis la marque :
  #   python3 tool/branding/generate_app_icons.py
  flutter_launcher_icons: ^0.14.4

  # Splash natif Baillan (iOS + Android, y compris Android 12+ SplashScreen).
  # Régénérer : `dart run flutter_native_splash:create`. Glyphes reproductibles
  # via le même `tool/branding/generate_app_icons.py`.
  flutter_native_splash: ^2.4.7

  # Riverpod codegen (optionnel, à activer si besoin)
  # riverpod_generator: ^2.6.3
  # custom_lint: ^0.6.5
  # riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  generate: true

  # Sérif éditorial Baillan (identité « acte notarial »). Bundlée en asset car
  # Flutter Web/CanvasKit ne résout pas les familles système CSS (Cochin,
  # Palatino…) — sans asset, le rendu retombe sur Roboto. EB Garamond, licence
  # OFL (assets/fonts/OFL.txt), subset latin (~63 Ko par style).
  fonts:
    - family: EB Garamond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/EBGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/EBGaramond-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/EBGaramond-SemiBoldItalic.ttf
          weight: 600
          style: italic

# ============================================================================
# Icônes d'app natives Baillan (iOS + Android) — flutter_launcher_icons
# ----------------------------------------------------------------------------
# Master unique = marque Baillan (B sérif italique crème sur fond encre, filet
# sauge), rendu depuis assets/fonts/EBGaramond-Italic.ttf par
# `tool/branding/generate_app_icons.py`. NE PAS toucher web/icons/ (icône web
# gérée séparément). Régénérer les icônes natives :
#   dart run flutter_launcher_icons
#
# - image_path             : master 1024 plein cadre, OPAQUE → iOS + Android legacy
# - remove_alpha_ios       : App Store exige un PNG 1024 sans canal alpha
# - background_color_ios   : encre (aplatissement alpha éventuel, jamais blanc)
# - adaptive_icon_*        : icône adaptative Android 26+ (fond encre + B/filet
#                            dans la safe zone centrale, fond transparent)
# ============================================================================
flutter_launcher_icons:
  image_path: "assets/icon/baillan_icon_master.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#1B1A17"
  min_sdk_android: 24
  adaptive_icon_background: "#1B1A17"
  adaptive_icon_foreground: "assets/icon/baillan_icon_foreground.png"

# ============================================================================
# Splash natif Baillan (iOS + Android) — flutter_native_splash
# ----------------------------------------------------------------------------
# Splash ADAPTATIF clair/sombre (suit l'apparence SYSTÈME — le splash est peint
# avant Flutter, donc le toggle de thème in-app n'est pas consulté) :
#   - CLAIR : fond papier #F7F4ED + « B » encre + paraphe olive
#             (= fond de chargement web index.html + scaffold clair → aucun flash)
#   - SOMBRE : fond encre #1B1A17 + « B » crème + paraphe sauge
#             (= tuile de l'icône d'app + scaffold sombre → transition sans couture)
# Glyphes = marque sur fond transparent, dans le cercle safe 768 px d'Android 12
# (canevas 1152, SANS icon_background_color). NE PAS réutiliser le master carré
# d'icône (ses coins seraient rognés par le masque circulaire).
# web: false → le splash web reste géré par web/index.html (non touché).
# Régénérer : `dart run flutter_native_splash:create`.
# ============================================================================
flutter_native_splash:
  color: "#F7F4ED"
  color_dark: "#1B1A17"
  image: assets/splash/baillan_glyph_ink.png
  image_dark: assets/splash/baillan_glyph_cream.png
  android: true
  ios: true
  web: false
  fullscreen: false
  ios_content_mode: center
  android_gravity: center
  android_12:
    color: "#F7F4ED"
    color_dark: "#1B1A17"
    image: assets/splash/baillan_glyph_ink.png
    image_dark: assets/splash/baillan_glyph_cream.png
