name: easyrent
description: "EasyRent — outil de gestion locative PWA"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.6.0

  # Navigation
  go_router: ^14.6.0

  # Modèles immutables
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # PDF
  pdf: ^3.11.0
  printing: ^5.13.0

  # i18n / locale FR
  intl: ^0.19.0

  # Logging
  logging: ^1.3.0

  # Utilities
  uuid: ^4.5.0
  collection: ^1.18.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

  # Riverpod codegen (optionnel, à activer si besoin)
  # riverpod_generator: ^2.6.3
  # custom_lint: ^0.6.5
  # riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  generate: true
